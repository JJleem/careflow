services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: careflow
      POSTGRES_PASSWORD: careflow
      POSTGRES_DB: careflow
    ports:
      # 호스트는 5433 — 평가자 로컬에 PostgreSQL이 이미 있어도 충돌하지 않도록
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      # 컨테이너 네트워크 안에서는 서비스명 'db'가 곧 호스트명
      DATABASE_URL: postgresql+psycopg://careflow:careflow@db:5432/careflow
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    # 브라우저 진입점 — nginx가 정적 파일 서빙 + /api를 backend로 프록시
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
