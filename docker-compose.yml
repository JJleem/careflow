services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: careflow
      POSTGRES_PASSWORD: careflow
      POSTGRES_DB: careflow
    ports:
      # 호스트는 5433 — 평가자 로컬에 PostgreSQL이 이미 있어도 충돌하지 않도록
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careflow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
