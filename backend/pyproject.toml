[project]
name = "careflow-backend"
version = "0.1.0"
description = "CareFlow — 검사 결과 기반 건강상담 운영 플랫폼 백엔드"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "apscheduler>=3.10,<4",
    "itsdangerous>=2.2",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
